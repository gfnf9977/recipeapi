<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кулінарна CRM</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon.png">
    <meta name="theme-color" content="#4f46e5">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .toast-enter { transform: translateY(100%); opacity: 0; }
        .toast-enter-active { transform: translateY(0); opacity: 1; transition: all 0.3s ease-out; }
        .toast-exit { transform: translateY(100%); opacity: 0; transition: all 0.3s ease-in; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 pb-24">

    <div id="toast-container" class="fixed bottom-20 left-0 right-0 z-50 flex flex-col items-center gap-2 pointer-events-none px-4"></div>

    <div class="max-w-7xl mx-auto p-4">
        <header class="flex justify-between items-center mb-8 mt-6">
            <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">Рецепти <span class="text-indigo-600">.</span></h1>
        </header>

        <div id="recipes-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <button onclick="openModal()" class="fixed bottom-6 right-6 bg-indigo-600 text-white w-14 h-14 rounded-full shadow-lg shadow-indigo-600/30 hover:bg-indigo-700 hover:scale-105 flex items-center justify-center text-3xl font-light transition-all z-40">
        +
    </button>

    <div id="modal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm hidden z-50 flex items-end sm:items-center justify-center transition-opacity">
        <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl h-[90vh] sm:h-[85vh] flex flex-col shadow-2xl overflow-hidden transform transition-all">

            <div class="px-6 py-4 border-b flex justify-between items-center bg-white">
                <h2 id="modal-title" class="text-xl font-bold text-gray-800">Новий рецепт</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-800 bg-gray-100 hover:bg-gray-200 rounded-full w-8 h-8 flex items-center justify-center transition-colors">✕</button>
            </div>

            <div class="p-6 overflow-y-auto flex-1 space-y-6 bg-gray-50/50">

                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                    <input id="title" type="text" placeholder="Назва страви..." class="w-full text-2xl font-bold p-2 mb-4 bg-transparent outline-none placeholder-gray-300">

                    <label class="block w-full h-40 border-2 border-dashed border-indigo-200 bg-indigo-50/30 hover:bg-indigo-50 rounded-xl flex items-center justify-center cursor-pointer transition-colors relative overflow-hidden">
                        <span class="text-indigo-400 text-sm flex flex-col items-center font-medium">
                            <span class="text-3xl mb-2">📸</span> Додати власне фото
                        </span>
                        <input type="file" accept="image/*" onchange="handleImageUpload(event)" class="hidden">
                        <img id="photo-preview" src="" class="absolute inset-0 w-full h-full object-cover hidden">
                    </label>
                </div>

                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                    <h3 class="font-bold text-sm text-gray-800 mb-3 flex items-center gap-2"><span>🛒</span> Інгредієнти</h3>
                    <ul id="list-ingredients" class="text-sm space-y-2 mb-4 text-gray-700"></ul>
                    <div class="flex gap-2">
                        <input id="input-ing" type="text" placeholder="Що потрібно?" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm outline-none focus:border-indigo-500 focus:ring-1 ring-indigo-500 transition-all">
                        <label class="flex items-center gap-1.5 text-xs font-medium text-gray-600 whitespace-nowrap cursor-pointer bg-gray-50 px-2 rounded-lg border border-gray-200">
                            <input id="check-ing" type="checkbox" checked class="accent-indigo-600 w-4 h-4"> Об.
                        </label>
                        <button type="button" onclick="addDynamicItem('ingredients')" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-4 rounded-lg font-bold text-lg transition-colors">+</button>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                    <h3 class="font-bold text-sm text-gray-800 mb-3 flex items-center gap-2"><span>🍳</span> Кроки приготування</h3>
                    <ol id="list-steps" class="text-sm space-y-2 mb-4 text-gray-700"></ol>
                    <div class="flex gap-2">
                        <input id="input-step" type="text" placeholder="Що робити далі?" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm outline-none focus:border-indigo-500 transition-all">
                        <button type="button" onclick="addDynamicItem('steps')" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-4 rounded-lg font-bold text-lg transition-colors">+</button>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                    <h3 class="font-bold text-sm text-gray-800 mb-3 flex items-center gap-2"><span>📺</span> Відео / Джерела</h3>
                    <ul id="list-videos" class="text-sm space-y-2 mb-4 text-gray-700"></ul>
                    <div class="flex gap-2">
                        <input id="input-video" type="text" placeholder="Посилання на TikTok/YouTube..." class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm outline-none focus:border-indigo-500 transition-all">
                        <button type="button" onclick="addDynamicItem('videos')" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-4 rounded-lg font-bold text-lg transition-colors">+</button>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                    <h3 class="font-bold text-sm text-gray-800 mb-3 flex items-center gap-2"><span>💡</span> Поради</h3>
                    <ul id="list-tips" class="text-sm space-y-2 mb-4 text-gray-700"></ul>
                    <div class="flex gap-2">
                        <input id="input-tip" type="text" placeholder="Маленький секрет..." class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm outline-none focus:border-indigo-500 transition-all">
                        <button type="button" onclick="addDynamicItem('tips')" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-4 rounded-lg font-bold text-lg transition-colors">+</button>
                    </div>
                </div>

            </div>

            <div class="p-4 border-t bg-white">
                <button id="save-btn" onclick="saveRecipe()" class="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl hover:bg-indigo-700 shadow-lg shadow-indigo-600/20 transition-all flex justify-center items-center gap-2">
                    <span>Зберегти рецепт</span>
                    <svg id="save-spinner" class="animate-spin h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <div id="photo-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-opacity">
    <div class="bg-white rounded-3xl w-full max-w-sm shadow-2xl overflow-hidden transform transition-all">
        <div class="p-6">
            <h3 class="text-xl font-bold text-gray-900 mb-2">Вітаємо з приготуванням! 🎉</h3>
            <p class="text-gray-500 text-sm mb-5">Хочеш додати фото свого кулінарного шедевра?</p>

            <div class="mb-5">
                <label class="block text-sm font-bold text-gray-700 mb-2">Обери фото (опціонально)</label>
                <input type="file" id="user-photo-file" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer transition-colors">
            </div>

            <div class="flex gap-3">
                <button id="cancel-photo-btn" onclick="closePhotoModal()" class="flex-1 bg-gray-100 text-gray-700 font-bold py-3 px-4 rounded-xl hover:bg-gray-200 transition-colors">
                    Не зараз
                </button>
                <button id="save-photo-btn" onclick="submitCookedStatus()" class="flex-1 bg-green-500 text-white font-bold py-3 px-4 rounded-xl shadow-md shadow-green-200 hover:bg-green-600 hover:shadow-lg transition-all flex justify-center items-center">
                    <span>Зберегти</span>
                </button>
            </div>
        </div>
    </div>
</div>

    <script>
        let state = { id: null, photoUrl: '', ingredients: [], videos: [], steps: [], tips: [] };
const IMGBB_API_KEY = '2eb318058608a823ca7fd957d4bace9e';
let currentCookingRecipeId = null;

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const color = type === 'success' ? 'bg-gray-800' : 'bg-red-500';
            toast.className = `${color} text-white px-6 py-3 rounded-full shadow-lg text-sm font-medium toast-enter-active`;
            toast.innerText = message;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    state.photoUrl = e.target.result;
                    document.getElementById('photo-preview').src = state.photoUrl;
                    document.getElementById('photo-preview').classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        function addDynamicItem(type) {
            if (type === 'ingredients') {
                const val = document.getElementById('input-ing').value;
                const mand = document.getElementById('check-ing').checked;
                if (!val) return;
                state.ingredients.push({ name: val, isMandatory: mand });
                document.getElementById('input-ing').value = '';
            }
            else if (type === 'steps') {
                const val = document.getElementById('input-step').value;
                if (!val) return;
                state.steps.push({ description: val });
                document.getElementById('input-step').value = '';
            }
            else if (type === 'videos') {
                const val = document.getElementById('input-video').value;
                if (!val) return;
                state.videos.push({ url: val });
                document.getElementById('input-video').value = '';
            }
            else if (type === 'tips') {
                const val = document.getElementById('input-tip').value;
                if (!val) return;
                state.tips.push({ description: val });
                document.getElementById('input-tip').value = '';
            }
            renderFormLists();
        }

        function renderFormLists() {
            document.getElementById('list-ingredients').innerHTML = state.ingredients.map((i, idx) =>
                `<li class="flex justify-between items-center bg-gray-50 p-2 rounded-lg">
                    <span class="font-medium">${i.name} ${i.isMandatory ? '<span class="text-indigo-500 text-lg leading-none">*</span>' : '<span class="text-gray-400 text-xs font-normal ml-1 border rounded px-1">за смаком</span>'}</span>
                    <button type="button" onclick="state.ingredients.splice(${idx}, 1); renderFormLists()" class="text-red-400 hover:text-red-600 bg-white rounded-md w-6 h-6 flex items-center justify-center shadow-sm">✕</button>
                </li>`).join('');

            document.getElementById('list-steps').innerHTML = state.steps.map((s, idx) =>
                `<li class="bg-gray-50 p-3 rounded-lg flex justify-between gap-2">
                    <div class="flex gap-3">
                        <span class="font-bold text-indigo-300">${idx+1}</span>
                        <span class="text-gray-700 leading-snug">${s.description}</span>
                    </div>
                    <button type="button" onclick="state.steps.splice(${idx}, 1); renderFormLists()" class="text-red-400 hover:text-red-600 flex-shrink-0">✕</button>
                </li>`).join('');

            document.getElementById('list-videos').innerHTML = state.videos.map((v, idx) =>
                `<li class="flex justify-between items-center bg-gray-50 p-2 rounded-lg truncate text-indigo-500 text-xs font-medium">
                    <span class="truncate pr-2">${v.url}</span>
                    <button type="button" onclick="state.videos.splice(${idx}, 1); renderFormLists()" class="text-red-400 hover:text-red-600 bg-white rounded-md w-6 h-6 flex items-center justify-center shadow-sm flex-shrink-0">✕</button>
                </li>`).join('');

            document.getElementById('list-tips').innerHTML = state.tips.map((t, idx) =>
                `<li class="bg-gray-50 p-3 rounded-lg flex justify-between gap-2 text-sm italic text-gray-600 border-l-2 border-indigo-300">
                    <span>${t.description}</span>
                    <button type="button" onclick="state.tips.splice(${idx}, 1); renderFormLists()" class="text-red-400 hover:text-red-600 flex-shrink-0">✕</button>
                </li>`).join('');
        }

        async function openModal(id = null) {
            document.getElementById('modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            document.getElementById('input-ing').value = '';
            document.getElementById('input-step').value = '';
            document.getElementById('input-video').value = '';
            document.getElementById('input-tip').value = '';

            if (id) {
                document.getElementById('modal-title').innerText = "Редагування";
                const response = await fetch('/api/recipes');
                const recipes = await response.json();
                const r = recipes.find(x => x.id === id);

                state = {
                    id: r.id, photoUrl: r.photoUrl || '', ingredients: r.ingredients || [],
                    videos: r.videoLinks || [], steps: r.steps || [], tips: r.tips || []
                };
                document.getElementById('title').value = r.title;

                if (state.photoUrl) {
                    document.getElementById('photo-preview').src = state.photoUrl;
                    document.getElementById('photo-preview').classList.remove('hidden');
                } else {
                    document.getElementById('photo-preview').classList.add('hidden');
                }
            } else {
                document.getElementById('modal-title').innerText = "Новий рецепт";
                state = { id: null, photoUrl: '', ingredients: [], videos: [], steps: [], tips: [] };
                document.getElementById('title').value = '';
                document.getElementById('photo-preview').classList.add('hidden');
            }
            renderFormLists();
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        async function loadRecipes() {
    const list = document.getElementById('recipes-list');

    const skeletonCard = `
        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden animate-pulse">
            <div class="h-56 bg-gray-200/60"></div>

            <div class="p-6">
                <div class="h-8 bg-gray-200/60 rounded-xl w-3/4 mb-5"></div>

                <div class="mb-5">
                    <div class="h-3 bg-indigo-100/50 rounded w-24 mb-3"></div>
                    <div class="flex gap-2">
                        <div class="h-8 bg-indigo-50/50 rounded-xl w-20 border border-indigo-50/50"></div>
                        <div class="h-8 bg-indigo-50/50 rounded-xl w-24 border border-indigo-50/50"></div>
                        <div class="h-8 bg-indigo-50/50 rounded-xl w-16 border border-indigo-50/50"></div>
                    </div>
                </div>

                <div class="space-y-3 mb-5">
                    <div class="h-3 bg-gray-200/60 rounded w-32 mb-2"></div>
                    <div class="h-10 bg-gray-50/80 rounded-xl border border-gray-100/50"></div>
                    <div class="h-10 bg-gray-50/80 rounded-xl border border-gray-100/50"></div>
                </div>

                <div class="pt-4 border-t border-gray-100">
                    <div class="h-3 bg-gray-200/60 rounded w-20 mb-3"></div>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="h-24 bg-gray-100/80 rounded-xl border border-gray-100/50"></div>
                        <div class="h-24 bg-gray-100/80 rounded-xl border border-gray-100/50"></div>
                    </div>
                </div>
            </div>
        </div>
    `;
    list.innerHTML = skeletonCard.repeat(3);

    try {
        const response = await fetch('/api/recipes');
        const recipes = await response.json();

        if (recipes.length === 0) {
            list.innerHTML = `
                <div class="text-center mt-24">
                    <div class="text-6xl mb-4">🍳</div>
                    <h3 class="text-xl font-bold text-gray-800 mb-2">Немає рецептів</h3>
                    <p class="text-gray-400">Натисни + щоб додати свій перший кулінарний шедевр</p>
                </div>`;
            return;
        }

        list.innerHTML = recipes.map(r => `
            <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden relative group transition-all hover:shadow-md">

                ${r.photoUrl ?
                `<div class="h-56 overflow-hidden relative">
                    <img src="${r.photoUrl}" class="w-full h-full object-cover">
                </div>` : ''}

                <div class="p-6">
                    <div class="flex justify-between items-start mb-5">
                        <h2 class="text-2xl font-bold text-gray-900 leading-tight">${r.title}</h2>
                        <div class="flex items-center gap-2">
                            <button onclick="toggleCookStatus(${r.id}, ${r.isCooked})" class="flex items-center gap-2 px-3 py-1.5 rounded-xl text-sm font-bold transition-all border shadow-sm mr-2 ${r.isCooked ? 'bg-green-50 text-green-700 border-green-200 hover:bg-green-100' : 'bg-white text-gray-500 border-gray-200 hover:bg-gray-50'}">
                                ${r.isCooked ? '✅ Готував' : '⚪ Не готував'}
                            </button>
                            <div class="flex gap-2 bg-gray-50 p-1 rounded-lg">
                                <button onclick="openModal(${r.id})" class="text-gray-500 hover:text-indigo-600 bg-white shadow-sm rounded-md w-8 h-8 flex items-center justify-center transition-colors">✎</button>
                                <button onclick="deleteRecipe(${r.id})" class="text-gray-500 hover:text-red-500 bg-white shadow-sm rounded-md w-8 h-8 flex items-center justify-center transition-colors">✕</button>
                            </div>
                        </div>
                    </div>

                    ${r.ingredients.length ?
                    `<div class="mb-5">
                        <h4 class="text-xs font-bold text-indigo-400 uppercase mb-3 tracking-wider">Інгредієнти</h4>
                        <div class="flex flex-wrap gap-2">
                            ${r.ingredients.map(i =>
                                `<span class="bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-xl text-sm font-medium border border-indigo-100/50">
                                    ${i.name} ${i.isMandatory ? '' : '<span class="opacity-50 text-xs ml-1 font-normal">/за смаком</span>'}
                                </span>
                            `).join('')}
                        </div>
                    </div>` : ''}

                    ${r.steps.length ?
                    `<div class="mb-5">
                        <h4 class="text-xs font-bold text-gray-400 uppercase mb-3 tracking-wider">Як готувати</h4>
                        <div class="space-y-3">
                            ${r.steps.map((s, idx) =>
                                `<div class="flex gap-3 text-sm text-gray-600 bg-gray-50/50 p-3 rounded-xl border border-gray-100">
                                    <span class="font-bold text-gray-300">${idx+1}</span>
                                    <span class="leading-relaxed">${s.description}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>` : ''}

                    ${r.tips.length ?
                    `<div class="mb-5 bg-amber-50/50 p-4 rounded-2xl border border-amber-100">
                        <h4 class="text-xs font-bold text-amber-500 uppercase mb-2 tracking-wider flex items-center gap-1"><span>💡</span> Поради</h4>
                        <ul class="space-y-2 text-sm text-amber-900/80">
                            ${r.tips.map(t => `<li class="italic leading-relaxed">${t.description}</li>`).join('')}
                        </ul>
                    </div>` : ''}

                    ${r.videoLinks.length ?
                    `<div class="pt-4 border-t border-gray-100">
                        <h4 class="text-xs font-bold text-gray-400 uppercase mb-3 tracking-wider flex items-center gap-2"><span>🎬</span> Джерела</h4>

                        <div class="grid grid-cols-2 gap-3">
                            ${r.videoLinks.map(v =>
                                `<a href="${v.url}" target="_blank" class="relative block h-24 rounded-xl overflow-hidden group shadow-sm bg-gray-100 flex justify-center items-center border border-gray-100">

                                    ${v.thumbnailUrl
                                        ? `<img src="${v.thumbnailUrl}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">`
                                        : `<span class="text-xs text-gray-400">Відкрити джерело</span>`}

                                    <div class="absolute inset-0 bg-black/20 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-300">
                                        <div class="bg-white/95 text-indigo-600 w-10 h-10 rounded-full flex items-center justify-center shadow-lg transform scale-90 group-hover:scale-100 transition-transform backdrop-blur-sm">
                                            <span class="text-lg ml-1 leading-none">▶</span>
                                        </div>
                                    </div>
                                </a>
                            `).join('')}
                        </div>
                    </div>` : ''}

                    ${r.userPhotoUrl ?
                    `<div class="mt-5 p-2 bg-gray-50 rounded-2xl border border-gray-100">
                        <h4 class="text-xs font-bold text-gray-400 uppercase mb-2 ml-2 tracking-wider flex items-center gap-2"><span>📸</span> Моє приготування</h4>
                        <img src="${r.userPhotoUrl}" class="w-full h-48 object-cover rounded-xl shadow-sm">
                    </div>` : ''}
                </div>
            </div>
        `).join('');
    } catch (error) {
        console.error("Помилка завантаження рецептів:", error);
        list.innerHTML = `<div class="text-center text-red-500 mt-10">Помилка завантаження даних. Спробуйте оновити сторінку.</div>`;
    }
}

        async function saveRecipe() {
            const title = document.getElementById('title').value;
            if(!title) return showToast('Назва страви обов\'язкова!', 'error');

            const btn = document.getElementById('save-btn');
            const spinner = document.getElementById('save-spinner');
            btn.disabled = true;
            spinner.classList.remove('hidden');

            const payload = {
                title: title, photoUrl: state.photoUrl, ingredients: state.ingredients,
                videoLinks: state.videos, steps: state.steps, tips: state.tips
            };

            const method = state.id ? 'PUT' : 'POST';
            const url = state.id ? `/api/recipes/${state.id}` : '/api/recipes';

            try {
                await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                closeModal();
                loadRecipes();
                showToast('Рецепт успішно збережено!');
            } catch (error) {
                showToast('Помилка при збереженні!', 'error');
            } finally {
                btn.disabled = false;
                spinner.classList.add('hidden');
            }
        }

        async function deleteRecipe(id) {
            if(confirm('Точно видалити цей рецепт?')) {
                await fetch(`/api/recipes/${id}`, { method: 'DELETE' });
                loadRecipes();
                showToast('Рецепт видалено');
            }
        }

        function toggleCookStatus(id, isCooked) {
    if (isCooked) {
        updateCookStatus(id, false, null);
    } else {
        currentCookingRecipeId = id;
        document.getElementById('photo-modal').classList.remove('hidden');
    }
}

function closePhotoModal() {
    document.getElementById('photo-modal').classList.add('hidden');
    document.getElementById('user-photo-file').value = '';
    currentCookingRecipeId = null;
}

async function submitCookedStatus() {
    const fileInput = document.getElementById('user-photo-file');
    const saveBtn = document.getElementById('save-photo-btn');
    const cancelBtn = document.getElementById('cancel-photo-btn');
    let photoUrl = null;

    saveBtn.disabled = true;
    cancelBtn.disabled = true;
    saveBtn.innerHTML = `<span class="animate-pulse">Завантаження...</span>`;

    try {
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('image', file);

            const imgbbResponse = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: 'POST',
                body: formData
            });

            const imgbbData = await imgbbResponse.json();
            if (imgbbData.success) {
                photoUrl = imgbbData.data.url;
            } else {
                alert("Не вдалося завантажити фото на хмару.");
            }
        }

        await updateCookStatus(currentCookingRecipeId, true, photoUrl);
        closePhotoModal();
    } catch (error) {
        console.error("Помилка:", error);
        alert("Сталася помилка при збереженні.");
    } finally {
        saveBtn.disabled = false;
        cancelBtn.disabled = false;
        saveBtn.innerHTML = `<span>Зберегти</span>`;
    }
}

async function updateCookStatus(id, isCooked, photoUrl) {
    try {
        const response = await fetch(`/api/recipes/${id}/cook`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                isCooked: isCooked,
                userPhotoUrl: photoUrl || null
            })
        });

        if (response.ok) {
            loadRecipes();
        }
    } catch (error) {
        console.error("Помилка оновлення статусу:", error);
    }
}

        loadRecipes();
    </script>
